services:
  - type: web
    name: deltax5
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 2 --bind 0.0.0.0:$PORT 'app:create_app()'
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ROBOTS_ALLOW_CRAWLING
        value: false
      - key: RATELIMIT_STORAGE_URI
        fromService:
          type: keyvalue
          name: deltax5-rate-limits
          property: connectionString
  - type: keyvalue
    name: deltax5-rate-limits
    plan: free
