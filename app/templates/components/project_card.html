<article class="project-card reveal" data-tilt="2.8" data-project-card data-category="{{ project.category|lower }}">
  <a class="project-card__link" href="{{ url_for('pages.project_detail', slug=project.slug) }}">
    <div class="project-card__media image-reveal">
      {% if project.poster %}
        <img src="{{ url_for('static', filename=project.poster) }}" alt="{{ project.alt_text }}" loading="lazy" decoding="async">
      {% else %}
        <div class="project-card__placeholder" role="img" aria-label="Abstract project artwork">
          <span class="project-card__placeholder-mark" aria-hidden="true">{{ project.mark|default('D5') }}</span>
          <span class="project-card__placeholder-line" aria-hidden="true"></span>
        </div>
      {% endif %}
      <span class="project-card__arrow" aria-hidden="true">↗</span>
    </div>
    <div class="project-card__meta">
      <div><span class="eyebrow">{{ project.category }}</span><h2>{{ project.title }}</h2></div>
      {% if project.year %}<span class="project-card__year">{{ project.year }}</span>{% endif %}
    </div>
    <p>{{ project.summary }}</p>
  </a>
</article>
